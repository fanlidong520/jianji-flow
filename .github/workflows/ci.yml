name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Verify built package data
        run: |
          python -m pip wheel --no-deps --wheel-dir wheelhouse .
          python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
          python -m jianji_flow --version
          python -c "from pathlib import Path; import jianji_flow.contracts as contracts; schema_dir = Path(contracts.__file__).resolve().parent / 'schemas'; assert len(list(schema_dir.glob('*.schema.json'))) == 5; print('package data ok')"

      - name: Run unit tests
        run: python -m pytest -q
