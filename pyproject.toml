[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jianji-flow"
version = "0.3.0.dev0"
description = "A Codex skill for automatic preview video remix workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.23.0",
  "pillow>=10.4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]
vision = [
  "numpy>=2.0.0",
  "opencv-python>=4.10.0.84"
]
edge-tts = [
  "edge-tts>=7.2.0"
]

[project.scripts]
jianji-flow = "jianji_flow.cli:main"

[tool.setuptools.package-data]
jianji_flow = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
